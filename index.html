<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-Clínico // Panel Administración</title>
    <style>
        :root {
            --bg-principal: #121214;
            --bg-tarjeta: #1a1a1e;
            --texto: #ffffff;
            --texto-secundario: #a0a0a5;
            --acento-azul: #0070f3;
            --acento-verde: #00df89;
            --borde: #2f2f35;
        }
        body {
            background-color: var(--bg-principal);
            color: var(--texto);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            border-bottom: 2px solid var(--borde);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 24px; }
        .rol-tag { color: var(--acento-azul); font-size: 14px; font-weight: bold; }
        .contenedor-mbi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .panel {
            background-color: var(--bg-tarjeta);
            border: 1px solid var(--borde);
            border-radius: 8px;
            padding: 20px;
        }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--borde); padding-bottom: 8px; }
        .grupo-campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--texto-secundario); }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-principal);
            border: 1px solid var(--borde);
            border-radius: 4px;
            color: var(--texto);
            box-sizing: border-box;
        }
        .checklist-estudios {
            border: 1px solid var(--borde);
            border-radius: 4px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            background-color: var(--bg-principal);
        }
        .opcion-estudio {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #232328;
        }
        .opcion-estudio:last-child { border-bottom: none; }
        .total-caja {
            margin-top: 20px;
            padding: 15px;
            background-color: #1a2333;
            border: 1px solid var(--acento-azul);
            border-radius: 4px;
            font-weight: bold;
            text-align: right;
            font-size: 18px;
        }
        button[type="submit"] {
            width: 100%;
            background-color: var(--acento-azul);
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        .tarjeta-examen {
            background-color: var(--bg-principal);
            border-left: 4px solid var(--acento-verde);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .btn-imprimir {
            background: none;
            border: 1px solid var(--acento-verde);
            color: var(--acento-verde);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header>
        <h1>SISTEMA DE GESTIÓN DE LABORATORIO CLÍNICO</h1>
        <span class="rol-tag">PANEL DE FACTURACIÓN Y ADMINISTRACIÓN</span>
    </header>

    <div class="contenedor-mbi">
        <section class="panel">
            <h2>💳 Registro de Paciente y Cobro</h2>
            <form id="form-orden">
                <div class="grupo-campo">
                    <label for="txt-nombre">Nombre Completo del Paciente:</label>
                    <input type="text" id="txt-nombre" required placeholder="Ej. Pedro Pérez">
                </div>
                <div class="grupo-campo">
                    <label for="txt-cedula">Cédula de Identidad:</label>
                    <input type="text" id="txt-cedula" required placeholder="Ej. 12345678">
                </div>
                <div class="grupo-campo">
                    <label>Seleccione Estudios Solicitados:</label>
                    <div id="contenedor-estudios-checklist" class="checklist-estudios"></div>
                </div>
                <div class="total-caja">
                    TOTAL A COBRAR: $<span id="lbl-total">0.00</span>
                </div>
                <button type="submit">💳 PROCESAR COBRO Y GUARDAR</button>
            </form>
        </section>

        <section class="panel">
            <h2>📋 Exámenes Finalizados (Listos para Entrega)</h2>
            <div id="lista-finalizados"></div>
        </section>
    </div>

    <div id="modal-impresion" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px);">
        <div style="background-color: #1a1a1e; border: 1px solid #2f2f35; color: #ffffff; margin: 8% auto; padding: 25px; width: 90%; max-width: 550px; border-radius: 8px; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
            
            <span id="btn-cerrar-modal" style="color: #a0a0a5; float: right; font-size: 28px; font-weight: bold; cursor: pointer; transition: color 0.2s;">&times;</span>
            
            <div id="modal-cuerpo-reporte" style="padding: 10px;">
                </div>
            
            <div style="margin-top: 25px; text-align: right; border-top: 1px solid #2f2f35; padding-top: 15px;">
                <button id="btn-confirmar-impresion" style="background-color: #0070f3; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s;">Cerrar Reporte</button>
            </div>
        </div>
    </div>

    <script type="module" src="./dist/views/Cl_vEstudio.js"></script>
</body>
</html>
